# Paso 5: canary release. 90% del tráfico del Gateway a la v1 y 10% a la v2
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: asr-flask
spec:
  hosts:
  - "*"
  gateways:
  - asr-gateway
  http:
  - route:
    - destination:
        host: asr-flask.default.svc.cluster.local
        subset: v1
        port:
          number: 80
      weight: 90
    - destination:
        host: asr-flask.default.svc.cluster.local
        subset: v2
        port:
          number: 80
      weight: 10
