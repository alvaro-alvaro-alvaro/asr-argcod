# Gateway: abre el puerto 80 en el ingress gateway de Istio (pods con label istio: ingressgateway)
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: asr-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
